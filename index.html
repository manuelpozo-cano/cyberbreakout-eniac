<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber-Breakout: De ENIAC a la Nube (4º ESO)</title>
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --card-hover: #1e2942;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #06b6d4;
      --primary-dark: #0891b2;
      --accent: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #1e293b;
      --neon-glow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; }

    header {
      background: linear-gradient(135deg, #0f172a, #0e7490);
      color: white; padding: 20px 24px; border-radius: 14px; margin-bottom: 20px;
      border: 1px solid rgba(6, 182, 212, 0.3); box-shadow: var(--neon-glow);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }
    header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
    header p { font-size: 0.85rem; opacity: 0.9; }

    .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .online-badge {
      font-size: 0.78rem; font-weight: 700; padding: 4px 10px; border-radius: 20px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .online-badge.active { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .online-badge.offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .timer-badge {
      background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b;
      font-size: 0.9rem; font-weight: 800; padding: 6px 12px; border-radius: 8px; font-family: monospace;
    }

    .btn-podio {
      background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a;
      font-weight: 800; padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.85rem; transition: transform 0.15s; display: inline-flex; align-items: center; gap: 6px;
    }
